name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # 真实发票样例不入库，依赖样例的用例会自动跳过。
      - run: npm test

      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: fapiao-merge-html
          path: dist/index.html
          if-no-files-found: error
