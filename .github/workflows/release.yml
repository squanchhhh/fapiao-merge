name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Rename single-file build
        run: cp dist/index.html "fapiao-merge-${GITHUB_REF_NAME}.html"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "fapiao-merge-${GITHUB_REF_NAME}.html#发票本地版单文件（双击打开）" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
